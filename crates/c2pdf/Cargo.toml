[package]
name = "code-to-pdf"
version = "0.2.3"
edition = "2024"
repository = "https://github.com/Tommypop2/code-to-pdf"
license = "MIT"
description = "Generates a syntax-highlighted PDF of your source code"
readme = "../../README.md"
[lib]
name = "c2pdf"
path = "src/lib/lib.rs"

[[bin]]
name = "c2pdf"
path = "src/bin/c2pdf.rs"
# required-features = ["font-loading"]
[[bin]]
name = "dc2pdf"
path = "src/bin/dc2pdf.rs"
[dependencies]
argh = "0.1.19"
crossbeam-channel = "0.5.16"
fast-glob = "1.1.1"
font-kit = { version = "0.14.3", optional = true }
fontdue = "0.9.3"
ignore = "0.4.33"
log = "0.4.34"
# printpdf = { git = "https://github.com/fschutt/printpdf", default-features = false}
# printpdf = { path = "../printpdf", default-features = false }
printpdf = { version = "0.12.7", default-features = false, features = [
	"jpeg",
	"png",
	"ico",
	"bmp",
	"webp",
] }
rayon = "1.11.0"
syntect = "5.3.0"
thread_local = "1.1.10"
two-face = "0.5.2"

[features]
default = ["font-loading"]
font-loading = ["dep:font-kit"]
